[package]
name = "typefree-background-platform-check"
version = "0.0.0"
edition = "2021"
[dependencies]
tauri = { path = "stub-tauri" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18.2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_RemoteDesktop", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }
