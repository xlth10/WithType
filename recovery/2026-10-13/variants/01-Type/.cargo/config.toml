# 仅本项目生效的 cargo 源配置（不写入用户全局 ~/.cargo/config.toml）。
# 当前网络无法直连 crates.io / index.crates.io，公司 Nexus 也没有 cargo 代理，
# 因此改用 rsproxy.cn 的 sparse 索引。Cargo 仍会用 Cargo.lock 里的 checksum 校验每个 crate。
[source.crates-io]
replace-with = "rsproxy-sparse"

[source.rsproxy-sparse]
registry = "sparse+https://rsproxy.cn/index/"