<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WithType · 进入动画预览</title>
<style>
  * { box-sizing: border-box; }
  body { height: 100vh; display: grid; grid-template-rows: auto minmax(0,1fr); margin: 0; background: #eeefe9; color: #282c27; font: 14px/1.5 "Segoe UI", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 18px; min-height: 64px; padding: 12px 20px; flex-wrap: wrap; }
  strong { font-weight: 650; } small { color: #676b63; }
  button { background: #282c27; color: white; border: 0; padding: 9px 18px; border-radius: 999px; cursor: pointer; }
  label { display: flex; align-items: center; gap: 10px; margin-left: auto; }
  input { width: min(260px, 35vw); accent-color: #282c27; } output { width: 52px; font-variant-numeric: tabular-nums; }
  iframe { display: block; width: 100%; height: 100%; min-height: 0; border: 0; background: #f8f9f4; }
  button:focus-visible, input:focus-visible { outline: 2px solid #676b63; outline-offset: 3px; }
</style>
<header><div><strong>WithType · 进入动画</strong><br><small>墨珠跃动，宣纸舒展</small></div><button id="play">重播</button><button id="reduce">减少动态</button><label>查看时刻<input id="frame" aria-label="查看动画时刻" type="range" min="0" max="1400" step="10" value="0"><output id="time">0 ms</output></label></header>
<iframe id="app" title="WithType 主窗口动画" src="/?opening=play"></iframe>
<script>
  const app = document.getElementById('app');
  const slider = document.getElementById('frame');
  const time = document.getElementById('time');
  document.getElementById('play').addEventListener('click', () => { app.src = '/?opening=play&replay=' + Date.now(); slider.value = 0; time.value = '播放中'; });
  document.getElementById('reduce').addEventListener('click', () => { app.src = '/?opening=reduced'; time.value = '静态'; });
  slider.addEventListener('input', () => { app.src = '/?opening=' + slider.value; time.value = slider.value + ' ms'; });
</script>
</html>
