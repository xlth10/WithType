name: Build Windows executable and installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test
      - name: Test Windows backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: npm run desktop:build
      - name: Verify executable and package portable app
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 -ReleaseDir src-tauri/target/release
          if (!(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue)) { throw 'NSIS installer was not built' }
          if (!(Get-ChildItem src-tauri/target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue)) { throw 'MSI installer was not built' }
      - uses: actions/upload-artifact@v4
        with:
          name: WithType-Windows-portable-x64
          if-no-files-found: error
          path: |
            dist/windows/withtype-windows-x64-portable.zip
            dist/windows/withtype-windows-x64-portable.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: WithType-Windows-installers
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
